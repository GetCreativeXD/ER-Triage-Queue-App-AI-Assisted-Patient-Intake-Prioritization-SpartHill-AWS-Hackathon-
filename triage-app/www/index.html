<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ER Triage</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!--
    Native (Capacitor) triage app shell. Two tabs:
      - Queue: live priority list with patient number + name.
      - Check-in QR: a QR code the staff phone shows so a patient can scan it
        with their camera and open the intake website on their own phone.
    All data comes from the same Express backend that serves the patient site.
  -->
  <header class="app-header">
    <div class="app-title">ER Triage</div>
    <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="queue">Queue</button>
    <button class="tab" data-tab="qr">Check-in QR</button>
  </nav>

  <div id="modal-host"></div>

  <script src="js/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
