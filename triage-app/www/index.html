<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>InTake</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!--
    InTake - triage staff dashboard (also shipped as a Capacitor native app).
    Bright, light theme. Header actions: a QR icon (shows the patient check-in
    QR in a popup), a bell icon with an unread-notification badge (shows the
    list of patient-submission notifications), and settings. The main view is a
    two-column dashboard: a draggable, color-coded patient list on the left and
    the selected patient's details on the right.
    All data comes from the same Express backend that serves the patient site.
  -->
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.svg" alt="InTake logo" width="34" height="34" />
      <span class="app-title">InTake</span>
    </div>
    <div class="header-actions">
      <button id="qr-btn" class="icon-btn" aria-label="Show check-in QR code" title="Check-in QR">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm3 0h2v2h-2v-2zm-3 3h2v2h-2v-2zm0 3h2v2h-2v-2zm3 0h2v2h-2v-2zm0-3h2v2h-2v-2z"/></svg>
      </button>
      <button id="bell-btn" class="icon-btn" aria-label="Notifications" title="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm6-6v-5a6 6 0 0 0-5-5.91V4a1 1 0 1 0-2 0v1.09A6 6 0 0 0 6 11v5l-1.7 1.7A1 1 0 0 0 5 19h14a1 1 0 0 0 .7-1.7L18 16z"/></svg>
        <span id="bell-badge" class="badge" hidden>0</span>
      </button>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.49 7.49 0 0 0 .05-.94 7.49 7.49 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94s.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.33.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.19.11.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div id="modal-host"></div>

  <script src="js/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
